<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VISION MEDIA | إدارة الموظفين</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enterprise-bio-geo.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="admin-auth.js"></script><style>body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f0f4f8;margin:0;direction:rtl}.admin-page{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07111e;color:white;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.side a{display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.75);text-decoration:none;padding:12px;border-radius:12px;margin:4px 0}.side a:hover,.side a.active{background:rgba(201,162,39,.15);color:#c9a227}.brand{color:#c9a227;font-weight:900;font-size:20px;margin-bottom:24px}.main{padding:26px}.page-title{font-size:24px;font-weight:900;color:#07111e;margin-bottom:8px}.page-sub{color:#6b7b90;margin-bottom:22px}.card{background:white;border:1px solid #e5e9f0;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800;font-size:12px;color:#07111e}.field input,.field select,.field textarea{border:1.5px solid #dfe6ee;border-radius:12px;padding:11px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;gap:8px;align-items:center;margin:3px}.btn-primary{background:#07111e;color:white}.btn-gold{background:#c9a227;color:#07111e}.btn-danger{background:#ffe8e8;color:#c62828}table{width:100%;border-collapse:collapse}th{background:#07111e;color:white;text-align:right;padding:12px}td{padding:10px;border-bottom:1px solid #edf1f5}.wrap{overflow:auto}@media(max-width:800px){.admin-page{grid-template-columns:1fr}.side{height:auto;position:relative}}</style>  <link rel="stylesheet" href="all-pages-organization-fix.css">
</head><body><script>if(!(window.VMAdminAuth&&VMAdminAuth.isAdmin())) location.replace('admin.html');</script><div class="admin-page"><aside class="side"><div class="brand">VISION MEDIA</div><a href="admin-dashboard.html"><i class="fas fa-gauge"></i> لوحة الأدمن</a><a href="admin-employees.html" class="active"><i class="fas fa-user-tie"></i> إدارة الموظفين</a><a href="admin-attendance.html" class=""><i class="fas fa-calendar-check"></i> الحضور</a><a href="admin-locations.html" class=""><i class="fas fa-map"></i> المواقع والخرائط</a><a href="admin-permissions.html" class=""><i class="fas fa-key"></i> الصلاحيات</a></aside><main class="main">
<div class="page-title">إدارة الموظفين</div><div class="page-sub">إضافة وتعديل وحذف الموظفين وربطهم بحسابات المستخدمين.</div>
<div class="card"><h3>إضافة / تعديل موظف</h3><div class="grid"><div class="field"><label>الاسم</label><input id="empName"></div><div class="field"><label>رقم الموظف</label><input id="empNo"></div><div class="field"><label>القسم</label><input id="empDept"></div><div class="field"><label>الوظيفة</label><input id="empJob"></div><div class="field"><label>الراتب</label><input id="empSalary" type="number"></div><div class="field"><label>بداية الدوام</label><input id="empStart" type="time" value="09:00"></div><div class="field"><label>نهاية الدوام</label><input id="empEnd" type="time" value="17:00"></div><div class="field"><label>السماح خارج النطاق</label><select id="empOutside"><option value="false">ممنوع</option><option value="true">مسموح</option></select></div></div><button class="btn btn-gold" onclick="saveEmp()"><i class="fas fa-save"></i> حفظ</button><button class="btn btn-primary" onclick="clearEmp()">جديد</button></div>
<div class="card"><h3>قائمة الموظفين</h3><div class="wrap"><table><thead><tr><th>الاسم</th><th>الرقم</th><th>القسم</th><th>الوظيفة</th><th>الراتب</th><th>الدوام</th><th>خارج النطاق</th><th>إجراءات</th></tr></thead><tbody id="empRows"></tbody></table></div></div>
</main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="enterprise-bio-geo.js"></script><script>
let editId=null; const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), uid=()=> 'vm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function clearEmp(){editId=null; ['empName','empNo','empDept','empJob','empSalary'].forEach(id=>document.getElementById(id).value=''); empStart.value='09:00'; empEnd.value='17:00'; empOutside.value='false'}
function saveEmp(){let arr=get('employees',[]); let item={id:editId||uid(),fullName:empName.value,employeeNumber:empNo.value||('EMP-'+(arr.length+1)),department:empDept.value,jobTitle:empJob.value,salary:+empSalary.value||0,workHours:{start:empStart.value,end:empEnd.value},allowOutside:empOutside.value==='true',status:'active',updatedAt:new Date().toISOString()}; if(!item.fullName)return alert('اكتب اسم الموظف'); let i=arr.findIndex(x=>x.id===item.id); if(i>-1)arr[i]={...arr[i],...item}; else arr.push(item); set('employees',arr); render(); clearEmp();}
function editEmp(id){let e=get('employees',[]).find(x=>x.id===id); if(!e)return; editId=id; empName.value=e.fullName||''; empNo.value=e.employeeNumber||''; empDept.value=e.department||''; empJob.value=e.jobTitle||''; empSalary.value=e.salary||0; empStart.value=(e.workHours||{}).start||'09:00'; empEnd.value=(e.workHours||{}).end||'17:00'; empOutside.value=String(!!e.allowOutside)}
function delEmp(id){if(!confirm('حذف الموظف؟'))return; set('employees',get('employees',[]).filter(x=>x.id!==id)); render()}
function render(){empRows.innerHTML=get('employees',[]).map(e=>`<tr><td>${e.fullName}</td><td>${e.employeeNumber||''}</td><td>${e.department||''}</td><td>${e.jobTitle||''}</td><td>${e.salary||0}</td><td>${(e.workHours||{}).start||''} - ${(e.workHours||{}).end||''}</td><td>${e.allowOutside?'مسموح':'ممنوع'}</td><td><button class="btn btn-primary" onclick="editEmp('${e.id}')">تعديل</button><button class="btn btn-danger" onclick="delEmp('${e.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="8">لا يوجد موظفون</td></tr>'} render();
</script></body></html>
