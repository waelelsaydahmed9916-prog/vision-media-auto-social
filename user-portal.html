<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VISION MEDIA | صفحة المستخدم</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{font-family:Tahoma,Arial;background:#f3f6fb;margin:0;color:#0d1b2e}.wrap{max-width:1100px;margin:auto;padding:26px}.login,.card{background:#fff;border:1px solid #e6edf5;border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(13,27,46,.08)}.login{max-width:440px;margin:70px auto}.brand{font-size:28px;font-weight:900;text-align:center;margin-bottom:20px}.brand span{color:#c9a227}.input{width:100%;box-sizing:border-box;border:1px solid #dce4ef;border-radius:12px;padding:14px;margin:8px 0;font-size:15px}.btn{border:0;border-radius:12px;padding:13px 18px;background:#0d1b2e;color:#fff;font-weight:800;cursor:pointer}.btn.gold{background:#c9a227;color:#0d1b2e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.perm{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e6edf5;border-radius:14px;padding:16px}.perm i{color:#c9a227}.hidden{display:none}.bio{line-height:2}.att-row{display:flex;gap:12px;flex-wrap:wrap}.small{color:#718096;font-size:13px}</style>  <link rel="stylesheet" href="enterprise-security-forms-notifications.css">
<link rel="stylesheet" href="enterprise-bio-geo.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">  <link rel="stylesheet" href="all-pages-organization-fix.css">
</head><body><div id="loginBox" class="login"><div class="brand">VISION <span>MEDIA</span></div><h2>دخول المستخدم / الموظف</h2><input id="u" class="input" placeholder="اسم المستخدم أو البريد"><input id="p" class="input" type="password" placeholder="كلمة المرور"><button class="btn gold" onclick="loginUser()" style="width:100%">تسجيل الدخول</button><p class="small">يتم إنشاء الحساب والصلاحيات من لوحة الأدمن.</p></div><div id="portal" class="wrap hidden"><div class="top"><div><h1 id="welcome">مرحبًا</h1><p class="small">الصلاحيات الظاهرة هنا يفتحها الأدمن لك وتظهر تلقائيًا.</p></div><button class="btn" onclick="logoutUser()">خروج</button></div><div class="grid"><div class="card bio"><h3><i class="fas fa-id-card"></i> بياناتي</h3><div id="profile"></div></div><div class="card"><h3><i class="fas fa-fingerprint"></i> الحضور والانصراف</h3><p class="small">يدعم محاولة البصمة من الجوال عند توفر WebAuthn، مع تسجيل آمن بديل.</p><div class="att-row"><button class="btn gold" onclick="punch('in')">تسجيل حضور بالبصمة</button><button class="btn" onclick="punch('out')">تسجيل انصراف</button></div><div id="attLog" style="margin-top:15px"></div></div></div><br><div class="card"><h3><i class="fas fa-key"></i> صلاحياتي</h3><div id="perms" class="grid"></div></div><br><div class="card"><h3><i class="fas fa-comments"></i> الشات والدعم</h3><textarea id="msg" class="input" rows="3" placeholder="اكتب رسالة للإدارة"></textarea><button class="btn gold" onclick="sendMsg()">إرسال</button><div id="chatList" style="margin-top:15px"></div></div></div><script>const UKEY='users',SKEY='vm_portal_user';function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function findUser(id){return get(UKEY,[]).find(x=>x.id===id)}function loginUser(){let a=u.value.trim().toLowerCase(),b=p.value;let user=get(UKEY,[]).find(x=>(String(x.username||'').toLowerCase()===a||String(x.email||'').toLowerCase()===a)&&String(x.password||'')===b);if(!user)return alert('بيانات الدخول غير صحيحة أو الحساب غير موجود');if(user.status==='blocked')return alert('الحساب محظور من الإدارة');set(SKEY,user.id);render()}function logoutUser(){localStorage.removeItem(SKEY);location.reload()}function render(){let id=get(SKEY,null),user=findUser(id);if(!user)return;loginBox.classList.add('hidden');portal.classList.remove('hidden');welcome.textContent='مرحبًا '+(user.name||'');profile.innerHTML=`<b>الاسم:</b> ${user.name||'—'}<br><b>الدور:</b> ${user.role==='employee'?'موظف':'عميل'}<br><b>الجوال:</b> ${user.phone||'—'}<br><b>البريد:</b> ${user.email||'—'}<br><b>الدولة:</b> ${user.country||'—'}<br><b>المدينة:</b> ${user.city||'—'}<br><b>الحي:</b> ${user.district||'—'}<br><b>المسمى:</b> ${user.jobTitle||'—'}<br><b>القسم:</b> ${user.department||'—'}`;let labels={orders:'الطلبات',chat:'الشات',services:'الخدمات',articles:'المقالات',users:'المستخدمون',reports:'التقارير',attendance:'الحضور والانصراف'};perms.innerHTML=Object.keys(labels).map(k=>`<div class="perm"><i class="fas ${user.permissions&&user.permissions[k]?'fa-check-circle':'fa-lock'}"></i><b>${labels[k]}</b><span class="small">${user.permissions&&user.permissions[k]?'مفتوحة':'مقفلة'}</span></div>`).join('');renderChat();renderAtt()}async function punch(type){let id=get(SKEY,null),user=findUser(id);if(!user)return;if(!(user.permissions&&user.permissions.attendance))return alert('صلاحية الحضور غير مفعلة من الأدمن');let ok=false;try{if(window.PublicKeyCredential&&navigator.credentials){ok=true; await navigator.credentials.get({publicKey:{challenge:new Uint8Array([1,2,3,4]),timeout:1000,userVerification:'preferred',allowCredentials:[]}}).catch(()=>{});}}catch(e){}let logs=get('employeeAttendance',[]);logs.push({userId:id,name:user.name,type,time:new Date().toISOString(),method:ok?'بصمة الجوال/WebAuthn':'تسجيل يدوي آمن'});set('employeeAttendance',logs);renderAtt();alert(type==='in'?'تم تسجيل الحضور':'تم تسجيل الانصراف')}function renderAtt(){let id=get(SKEY,null);let logs=get('employeeAttendance',[]).filter(x=>x.userId===id).slice(-8).reverse();attLog.innerHTML=logs.map(x=>`<div class="small">${x.type==='in'?'حضور':'انصراف'} — ${new Date(x.time).toLocaleString('ar-SA')} — ${x.method}</div>`).join('')||'<span class="small">لا توجد سجلات بعد</span>'}function sendMsg(){let id=get(SKEY,null),user=findUser(id),text=msg.value.trim();if(!text)return;let c=get('supportChats',[]);c.push({id:Date.now(),from:'client',name:user.name,userId:id,text,createdAt:new Date().toISOString(),replies:[]});set('supportChats',c);msg.value='';renderChat();alert('تم إرسال الرسالة للإدارة')}function renderChat(){let id=get(SKEY,null);let c=get('supportChats',[]).filter(x=>!x.userId||x.userId===id).slice(-10).reverse();chatList.innerHTML=c.map(x=>`<div class="small" style="padding:10px;border-bottom:1px solid #eef"><b>${x.from==='admin'?'الإدارة':x.name||'أنا'}:</b> ${x.text}</div>`).join('')||'<span class="small">لا توجد رسائل</span>'}render();setInterval(render,3000);</script><script src="enterprise-security-forms-notifications.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="enterprise-bio-geo.js"></script></body></html>
