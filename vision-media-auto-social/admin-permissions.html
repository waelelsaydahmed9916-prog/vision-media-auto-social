<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VISION MEDIA | إدارة الصلاحيات</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enterprise-bio-geo.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="admin-auth.js"></script><style>body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f0f4f8;margin:0;direction:rtl}.admin-page{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07111e;color:white;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.side a{display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.75);text-decoration:none;padding:12px;border-radius:12px;margin:4px 0}.side a:hover,.side a.active{background:rgba(201,162,39,.15);color:#c9a227}.brand{color:#c9a227;font-weight:900;font-size:20px;margin-bottom:24px}.main{padding:26px}.page-title{font-size:24px;font-weight:900;color:#07111e;margin-bottom:8px}.page-sub{color:#6b7b90;margin-bottom:22px}.card{background:white;border:1px solid #e5e9f0;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800;font-size:12px;color:#07111e}.field input,.field select,.field textarea{border:1.5px solid #dfe6ee;border-radius:12px;padding:11px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;gap:8px;align-items:center;margin:3px}.btn-primary{background:#07111e;color:white}.btn-gold{background:#c9a227;color:#07111e}.btn-danger{background:#ffe8e8;color:#c62828}table{width:100%;border-collapse:collapse}th{background:#07111e;color:white;text-align:right;padding:12px}td{padding:10px;border-bottom:1px solid #edf1f5}.wrap{overflow:auto}@media(max-width:800px){.admin-page{grid-template-columns:1fr}.side{height:auto;position:relative}}</style>  <link rel="stylesheet" href="all-pages-organization-fix.css">
</head><body><script>if(!(window.VMAdminAuth&&VMAdminAuth.isAdmin())) location.replace('admin.html');</script><div class="admin-page"><aside class="side"><div class="brand">VISION MEDIA</div><a href="admin-dashboard.html"><i class="fas fa-gauge"></i> لوحة الأدمن</a><a href="admin-employees.html" class=""><i class="fas fa-user-tie"></i> إدارة الموظفين</a><a href="admin-attendance.html" class=""><i class="fas fa-calendar-check"></i> الحضور</a><a href="admin-locations.html" class=""><i class="fas fa-map"></i> المواقع والخرائط</a><a href="admin-permissions.html" class="active"><i class="fas fa-key"></i> الصلاحيات</a></aside><main class="main">
<div class="page-title">إدارة الصلاحيات</div><div class="page-sub">فتح وإغلاق الصلاحيات وتظهر مباشرة في صفحة المستخدم.</div><div class="card"><h3>المستخدمون</h3><div class="wrap"><table><thead><tr><th>المستخدم</th><th>الدور</th><th>الصلاحيات</th><th>حفظ</th></tr></thead><tbody id="permRows"></tbody></table></div></div>
</main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="enterprise-bio-geo.js"></script><script>
const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)); const perms=['orders','orderReply','services','articles','clients','users','employees','attendance','salaries','settings','notifications','policies','payments','locations','maps','biometric']; const labels={orders:'مشاهدة الطلبات',orderReply:'الرد على الطلبات',services:'إدارة الخدمات',articles:'إدارة المقالات',clients:'إدارة العملاء',users:'إدارة المستخدمين',employees:'إدارة الموظفين',attendance:'الحضور',salaries:'الرواتب',settings:'الإعدادات',notifications:'الإشعارات',policies:'السياسات',payments:'الدفع',locations:'المواقع',maps:'الخرائط',biometric:'البصمة'};
function render(){let users=get('vm_users',get('users',[])); permRows.innerHTML=users.map(u=>`<tr><td>${u.fullName||u.name||u.username}</td><td>${u.role||'user'}</td><td>${perms.map(p=>`<label style="display:inline-flex;gap:5px;margin:5px"><input type="checkbox" data-user="${u.id}" data-perm="${p}" ${u.permissions&&u.permissions[p]?'checked':''}> ${labels[p]}</label>`).join('')}</td><td><button class="btn btn-gold" onclick="savePerm('${u.id}')">حفظ</button></td></tr>`).join('')||'<tr><td colspan="4">لا يوجد مستخدمون</td></tr>'}
function savePerm(id){let users=get('vm_users',get('users',[])); let u=users.find(x=>x.id===id); if(!u)return; u.permissions={}; document.querySelectorAll(`input[data-user="${id}"]`).forEach(c=>u.permissions[c.dataset.perm]=c.checked); set('vm_users',users); set('users',users); alert('تم حفظ الصلاحيات وستظهر مباشرة للمستخدم')} render();
</script></body></html>
