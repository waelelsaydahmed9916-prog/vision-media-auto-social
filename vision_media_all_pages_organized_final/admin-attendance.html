<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VISION MEDIA | الحضور والانصراف</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enterprise-bio-geo.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="admin-auth.js"></script><style>body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f0f4f8;margin:0;direction:rtl}.admin-page{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07111e;color:white;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.side a{display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.75);text-decoration:none;padding:12px;border-radius:12px;margin:4px 0}.side a:hover,.side a.active{background:rgba(201,162,39,.15);color:#c9a227}.brand{color:#c9a227;font-weight:900;font-size:20px;margin-bottom:24px}.main{padding:26px}.page-title{font-size:24px;font-weight:900;color:#07111e;margin-bottom:8px}.page-sub{color:#6b7b90;margin-bottom:22px}.card{background:white;border:1px solid #e5e9f0;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800;font-size:12px;color:#07111e}.field input,.field select,.field textarea{border:1.5px solid #dfe6ee;border-radius:12px;padding:11px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;display:inline-flex;gap:8px;align-items:center;margin:3px}.btn-primary{background:#07111e;color:white}.btn-gold{background:#c9a227;color:#07111e}.btn-danger{background:#ffe8e8;color:#c62828}table{width:100%;border-collapse:collapse}th{background:#07111e;color:white;text-align:right;padding:12px}td{padding:10px;border-bottom:1px solid #edf1f5}.wrap{overflow:auto}@media(max-width:800px){.admin-page{grid-template-columns:1fr}.side{height:auto;position:relative}}</style>  <link rel="stylesheet" href="all-pages-organization-fix.css">
</head><body><script>if(!(window.VMAdminAuth&&VMAdminAuth.isAdmin())) location.replace('admin.html');</script><div class="admin-page"><aside class="side"><div class="brand">VISION MEDIA</div><a href="admin-dashboard.html"><i class="fas fa-gauge"></i> لوحة الأدمن</a><a href="admin-employees.html" class=""><i class="fas fa-user-tie"></i> إدارة الموظفين</a><a href="admin-attendance.html" class="active"><i class="fas fa-calendar-check"></i> الحضور</a><a href="admin-locations.html" class=""><i class="fas fa-map"></i> المواقع والخرائط</a><a href="admin-permissions.html" class=""><i class="fas fa-key"></i> الصلاحيات</a></aside><main class="main">
<div class="page-title">الحضور والانصراف</div><div class="page-sub">متابعة وتعديل واعتماد سجلات الحضور مع التصدير.</div>
<div class="card"><div class="grid"><div class="field"><label>الموظف</label><select id="attEmp"></select></div><div class="field"><label>التاريخ</label><input id="attDate" type="date"></div><div class="field"><label>وقت الحضور</label><input id="attIn" type="time"></div><div class="field"><label>وقت الانصراف</label><input id="attOut" type="time"></div><div class="field"><label>الحالة</label><select id="attStatus"><option>حاضر</option><option>متأخر</option><option>غائب</option><option>إجازة</option><option>عمل ميداني</option></select></div><div class="field"><label>ملاحظات</label><input id="attNotes"></div></div><button class="btn btn-gold" onclick="saveAtt()">حفظ حضور يدوي</button><button class="btn btn-primary" onclick="exportCSV()">تصدير Excel CSV</button><button class="btn btn-primary" onclick="window.print()">طباعة</button></div>
<div class="card"><h3>السجل</h3><div class="wrap"><table><thead><tr><th>الموظف</th><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>ساعات</th><th>تأخير</th><th>إضافي</th><th>الحالة</th><th>التحقق</th><th>إجراءات</th></tr></thead><tbody id="attRows"></tbody></table></div></div>
</main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="enterprise-bio-geo.js"></script><script>
const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), uid=()=> 'vm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); let editId=null; function hrs(a,b){if(!a||!b)return 0;let A=a.split(':').map(Number),B=b.split(':').map(Number);return Math.max(0,((B[0]*60+B[1])-(A[0]*60+A[1]))/60)}
function loadEmps(){let e=get('employees',[]); attEmp.innerHTML=e.map(x=>`<option value="${x.id}">${x.fullName}</option>`).join(''); attDate.value=new Date().toISOString().slice(0,10)}
function saveAtt(){let e=get('employees',[]).find(x=>x.id===attEmp.value); if(!e)return alert('اختر الموظف'); let arr=get('attendance',[]); let item={id:editId||uid(),employeeId:e.id,employeeName:e.fullName,employeeNumber:e.employeeNumber,department:e.department,date:attDate.value,checkIn:attIn.value,checkOut:attOut.value,totalHours:hrs(attIn.value,attOut.value),lateHours:Math.max(0,hrs((e.workHours||{}).start||'09:00',attIn.value)),overtimeHours:Math.max(0,hrs((e.workHours||{}).end||'17:00',attOut.value)),attendanceStatus:attStatus.value,verificationMethod:'إدخال يدوي من الأدمن',notes:attNotes.value,approvedBy:'admin',createdAt:new Date().toISOString()}; let i=arr.findIndex(x=>x.id===item.id); if(i>-1)arr[i]={...arr[i],...item}; else arr.push(item); set('attendance',arr); editId=null; render()}
function editAtt(id){let r=get('attendance',[]).find(x=>x.id===id); if(!r)return; editId=id; attEmp.value=r.employeeId; attDate.value=r.date; attIn.value=r.checkIn||''; attOut.value=r.checkOut||''; attStatus.value=r.attendanceStatus||'حاضر'; attNotes.value=r.notes||''}
function delAtt(id){if(!confirm('حذف سجل الحضور؟'))return; set('attendance',get('attendance',[]).filter(x=>x.id!==id)); render()}
function render(){attRows.innerHTML=get('attendance',[]).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<tr><td>${r.employeeName}</td><td>${r.date}</td><td>${r.checkIn||'—'}</td><td>${r.checkOut||'—'}</td><td>${r.totalHours||0}</td><td>${(+r.lateHours||0).toFixed(1)}</td><td>${(+r.overtimeHours||0).toFixed(1)}</td><td>${r.attendanceStatus||''}</td><td>${r.verificationMethod||''}</td><td><button class="btn btn-primary" onclick="editAtt('${r.id}')">تعديل</button><button class="btn btn-danger" onclick="delAtt('${r.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="10">لا يوجد سجلات</td></tr>'}
function exportCSV(){let rows=get('attendance',[]); let csv='employee,date,checkIn,checkOut,totalHours,status\n'+rows.map(r=>[r.employeeName,r.date,r.checkIn,r.checkOut,r.totalHours,r.attendanceStatus].join(',')).join('\n'); let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='attendance.csv';a.click()} loadEmps(); render();
</script></body></html>
